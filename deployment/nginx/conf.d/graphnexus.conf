# =============================================================================
# GraphNexus API 反向代理
# =============================================================================
# 依据: dev-view 网关层 — JWT 认证 + RBAC 鉴权
#       physical-view — Nginx 是公网进入内网的唯一入口
# =============================================================================

server {
    listen       8080;
    server_name  localhost;

    # ---- 根路径静态信息 ----
    location = / {
        default_type text/plain;
        return 200 'GraphNexus API Gateway
';
    }

    # ---- Actuator 健康检查（不经过后端）----
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"nginx"}';
    }

    # =========================================================================
    # GraphNexus 业务 API 反向代理
    # 对应路由组:
    #   /admin/*        → 管理员端点
    #   /teacher/*      → 教师端点
    #   /student/*      → 学生端点
    #   /ops/*          → 运维端点
    #   /operations/*   → 运营端点
    # =========================================================================
    location /api/ {
        proxy_pass http://graphnexus_backend;

        # 代理头
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_set_header X-Trace-ID          $request_id;

        # 超时配置（LLM 流式调用超时较长）
        proxy_connect_timeout       15s;
        proxy_send_timeout          120s;
        proxy_read_timeout          300s;       # LLM 流式响应可长达 5 分钟

        # 缓冲配置（关闭流式响应缓冲）
        proxy_buffering             off;
        proxy_request_buffering     off;

        # WebSocket 支持（用于实时通知推送）
        proxy_http_version          1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # Actuator 端点（仅运维入口可访问）
    # 路径: /actuator/health, /actuator/prometheus, /actuator/metrics
    # =========================================================================
    location /actuator/ {
        proxy_pass http://graphnexus_backend;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
    }

    # =========================================================================
    # MinIO 控制台反向代理（通过 Nginx 访问）
    # =========================================================================
    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
    }

    # =========================================================================
    # RabbitMQ 管理界面反向代理
    # =========================================================================
    location /rabbitmq/ {
        proxy_pass http://rabbitmq:15672/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
    }

    # =========================================================================
    # Neo4j Browser 反向代理
    # =========================================================================
    location /neo4j/ {
        proxy_pass http://neo4j:7474/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
    }

    # ---- 错误页 ----
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
