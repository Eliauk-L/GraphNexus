# =============================================================================
# GraphNexus API 虚拟主机配置
# =============================================================================
# 依据:
#   7 个 Controller, 17 个端点
#   负载均衡策略: least_conn（主配置文件 upstream 中定义）
#   容器内端口: graphnexus-app-{1,2}:8080
#
# 超时策略（按端点耗时特征分级）:
#   超长 (1800s): /api/v1/graph/fusion/execute  — 全图融合
#   长   (900s) : /api/v1/document/*/process      — MinerU PDF 解析
#                /api/v1/graph/extract/*          — LLM 知识图谱抽取
#   上传 (300s) : /api/v1/document/upload         — 文件上传（100MB）
#   标准 (300s) : 其余所有 API                     — 查询/问答/CRUD/指标
# =============================================================================

server {
    listen       8080;
    server_name  localhost;

    # =========================================================================
    # 根路径 — Nginx 自身标识
    # =========================================================================
    location = / {
        default_type text/plain;
        return 200 'GraphNexus API Gateway — Nginx';
    }

    # =========================================================================
    # Nginx 自身健康检查（不经过后端，用于容器 healthcheck）
    # =========================================================================
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"nginx","load_balancer":"least_conn"}';
    }

    # =========================================================================
    # Swagger UI / OpenAPI 文档
    #   /swagger-ui.html       → Swagger UI 页面入口
    #   /swagger-ui/**          → Swagger UI 静态资源（CSS/JS）
    #   /v3/api-docs            → OpenAPI 3.0 JSON 规范
    #   /v3/api-docs/**         → OpenAPI 规范子路径
    # =========================================================================
    location = /swagger-ui.html {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout       10s;
        proxy_read_timeout          30s;
    }

    location /swagger-ui/ {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout       10s;
        proxy_read_timeout          30s;

        # Swagger 静态资源适合短期缓存
        expires                     1h;
        add_header                  Cache-Control "public";
    }

    location /v3/api-docs {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout       10s;
        proxy_read_timeout          30s;
    }

    # =========================================================================
    # Actuator 端点 — 应用健康检查 & Prometheus 指标
    # 路径: /actuator/health, /actuator/prometheus, /actuator/metrics
    # 不缓存，短超时（健康检查应快速失败）
    # =========================================================================
    location /actuator/ {
        proxy_pass http://graphnexus_backend;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        proxy_connect_timeout       5s;
        proxy_send_timeout          5s;
        proxy_read_timeout          10s;

        proxy_buffering             on;
        proxy_cache                 off;
        add_header                  Cache-Control "no-store";
    }

    # =========================================================================
    # 超长超时端点 — 全图融合（可耗时数分钟）
    # POST /api/v1/graph/fusion/execute
    # =========================================================================
    location ~ ^/api/v1/graph/fusion/ {
        proxy_pass http://graphnexus_backend;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;

        proxy_connect_timeout       15s;
        proxy_send_timeout          30s;
        proxy_read_timeout          1800s;    # 融合最坏情况 30 分钟

        proxy_buffering             off;      # 关闭缓冲，实时返回进度
        proxy_request_buffering     on;
    }

    # =========================================================================
    # 长超时端点 — PDF 解析 / 知识图谱抽取
    # POST /api/v1/document/{id}/process
    # POST /api/v1/graph/extract/{documentId}
    # GET  /api/v1/graph/document/{documentId}
    # =========================================================================
    location ~ ^/api/v1/document/[0-9]+/process$ {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout       15s;
        proxy_send_timeout          30s;
        proxy_read_timeout          900s;     # MinerU v4 解析 15 分钟

        proxy_buffering             off;
        proxy_request_buffering     on;
    }

    location ~ ^/api/v1/graph/extract/ {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout       15s;
        proxy_send_timeout          30s;
        proxy_read_timeout          900s;     # LLM 抽取 15 分钟

        proxy_buffering             off;
        proxy_request_buffering     on;
    }

    # =========================================================================
    # 文件上传端点 — multipart/form-data（最大 50MB/文件，55MB/请求）
    # POST /api/v1/document/upload
    # =========================================================================
    location = /api/v1/document/upload {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        client_max_body_size        100m;     # 留余量
        client_body_timeout          300s;

        proxy_connect_timeout       15s;
        proxy_send_timeout          300s;     # 上传大文件
        proxy_read_timeout          300s;     # CSV 入库 + Neo4j 写入

        proxy_request_buffering     off;      # 流式上传，不先缓存到磁盘
        proxy_buffering             off;
    }

    # =========================================================================
    # 标准 API 端点 — 所有其余 /api/* 请求
    # 涵盖:
    #   GET/PUT/DELETE  /api/v1/document, /api/v1/document/{id}
    #   GET              /api/v1/document/grade/exam/{examNo}
    #   DELETE           /api/v1/document/grade/exam/{examNo}
    #   POST             /api/v1/query/ask, /ask-async, /chat
    #   GET              /api/v1/query/result/{taskId}
    #   GET              /api/v1/analysis/subgraph/{taskId}
    #   GET              /api/v1/graph/document/{documentId}
    #   GET              /api/v1/graph/metrics/pagerank, /degree
    #   POST             /api/v1/llm/ping, /debug（调试，非生产使用）
    # =========================================================================
    location /api/ {
        proxy_pass http://graphnexus_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout       15s;
        proxy_send_timeout          60s;
        proxy_read_timeout          300s;     # LLM ask/chat/async 5 分钟

        # 关闭缓冲以支持 LLM 流式响应（预留）
        proxy_buffering             off;
        proxy_request_buffering     on;
    }

    # =========================================================================
    # 管理面板反向代理（可选，开发环境使用）
    #
    # 使用变量 proxy_pass 实现运行时 DNS 解析，避免 nginx 启动时因
    # minio/rabbitmq/neo4j 容器尚未就绪而崩溃。
    # 若基础设施未启动，对应路径返回 502，不影响核心 API 功能。
    # =========================================================================

    # MinIO Console（变量解析，启动时不校验 minio 主机名）
    location /minio/ {
        set $minio_backend "minio:9001";
        proxy_pass http://$minio_backend/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    }

    # RabbitMQ Management UI
    location /rabbitmq/ {
        set $rabbitmq_backend "rabbitmq:15672";
        proxy_pass http://$rabbitmq_backend/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    }

    # Neo4j Browser
    location /neo4j/ {
        set $neo4j_backend "neo4j:7474";
        proxy_pass http://$neo4j_backend/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # 错误页
    # =========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}