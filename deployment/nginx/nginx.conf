# =============================================================================
# Nginx 主配置文件（GraphNexus 应用集群反向代理）
# =============================================================================
# 角色: 反向代理 + 负载均衡，统一入口 :8080 → graphnexus-app-1/2
# 负载均衡策略: least_conn（最小连接数，适配混合短/长请求场景）
# 部署位置: deployment/nginx/nginx.conf → 挂载到 graphnexus-nginx 容器
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    # ---- 基础设置 ----
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- JSON 访问日志（含上游信息） ----
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"trace_id":"$http_x_trace_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log json;

    # ---- 性能优化 ----
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  100;

    # ---- 全局上传限制（各 location 可按需覆盖） ----
    client_max_body_size    100m;
    client_body_timeout      120s;
    client_header_timeout     30s;

    # ---- Gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss application/atom+xml;

    # ---- WebSocket 升级检测（proxy-headers.conf 引用） ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- DNS 解析器 — 指向 Podman/Docker 内嵌 DNS（127.0.0.11） ----
    # 用于管理面板的变量 proxy_pass 运行时解析，避免启动时崩溃
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # =========================================================================
    # 上游服务组 — GraphNexus 应用集群
    # =========================================================================
    # 策略: least_conn — 将新请求分配给当前活跃连接数最少的后端
    #       适合混合场景：短请求（查询） + 长请求（融合/解析）
    # 内部端口: 容器网络内应用监听 8080（非宿主机 8081/8082）
    # =========================================================================
    upstream graphnexus_backend {
        least_conn;
        server graphnexus-app-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server graphnexus-app-2:8080 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;           # 到每个后端的空闲长连接池
    }

    # ---- 引入虚拟主机配置 ----
    include /etc/nginx/conf.d/*.conf;
}