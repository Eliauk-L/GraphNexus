# =============================================================================
# Nginx 主配置文件（GraphNexus MVP 部署）
# =============================================================================
# 角色: 反向代理 + 负载均衡，内网统一入口
# 对应物理视图: PC浏览器 → HTTP → Nginx:8080 → GraphNexus:8081/8082
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    # ---- 基础设置 ----
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"trace_id":"$http_x_trace_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log json;

    # ---- 性能优化 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 100m;          # PDF 上传最大 100MB
    client_body_timeout   120s;
    client_header_timeout 30s;

    # ---- Gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss application/atom+xml;

    # ---- 上游服务组（GraphNexus 业务服务）----
    # MVP 阶段单实例；生产阶段可扩展为多个 upstream server
    upstream graphnexus_backend {
        # 实例 1（对应物理视图 GraphNexus 实例1 :8081）
        server graphnexus-app-1:8081 weight=1 max_fails=3 fail_timeout=30s;
        # 实例 2（对应物理视图 GraphNexus 实例2 :8082）
        # 注意: MVP 阶段不需要多实例，生产时取消注释并调整
        # server graphnexus-app-2:8082 weight=1 max_fails=3 fail_timeout=30s;
    }

    # ---- 引入虚拟主机配置 ----
    include /etc/nginx/conf.d/*.conf;
}
