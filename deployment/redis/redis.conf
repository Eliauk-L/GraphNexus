# =============================================================================
# Redis 7.x 配置文件（GraphNexus MVP 部署 / 低内存适配）
# =============================================================================

# ---- 网络 ----
bind 0.0.0.0
port 6379
tcp-backlog 128
timeout 0
tcp-keepalive 60

# ---- 认证 ----
requirepass graphnexus123

# ---- 通用 ----
daemonize no
supervised no
loglevel warning
logfile ""
databases 4

# ---- 持久化（仅 RDB，内存紧张时不开启 AOF）----
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF 关闭（内存紧张时节省 I/O 和内存）
appendonly no

# ---- 内存管理（适配 64 MiB 容器上限）----
# maxmemory 32mb
maxmemory-policy volatile-lru

# ---- 慢查询日志 ----
slowlog-log-slower-than 10000
slowlog-max-len 64

# ---- 客户端 ----
maxclients 100