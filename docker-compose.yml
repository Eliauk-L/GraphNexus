FROM python:3.10-slim

# 安装依赖
RUN apt-get update && \
    apt-get install -y fonts-noto-core fonts-noto-cjk fontconfig libgl1 && \
    fc-cache -fv && \
    apt-get clean && \
    rm -rf /var/lib/apt/lists/*

# 安装 MinerU（仅 core，无 CUDA 依赖）
RUN python3 -m pip install -U 'mineru[core]' -i https://pypi.tuna.tsinghua.edu.cn/simple && \
    python3 -m pip cache purge && python3 -m pip uninstall opencv-python -y && \ 
    python3 -m pip install opencv-python-headless


# 下载模型（可选，或挂载本地模型目录）
RUN mineru-models-download -s modelscope -m all

# 设置入口
ENTRYPOINT ["/bin/bash", "-c", "export MINERU_MODEL_SOURCE=local && exec \"$@\"", "--"]