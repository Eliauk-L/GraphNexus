# =============================================================================
# GraphNexus 开发环境配置
# =============================================================================
# 用途: 本地开发，连接 podman-compose 启动的容器
# 启动: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================================================

spring:
  config:
    import: optional:file:.env
  # ---------------------------------------------------------------------------
  # Neo4j 图数据库
  # ---------------------------------------------------------------------------
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: graphnexus123
    pool:
      max-connection-pool-size: 20

  # ---------------------------------------------------------------------------
  # MySQL 关系数据库
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/graphnexus?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: graphnexus
    password: graphnexus123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ---------------------------------------------------------------------------
  # 文件上传限制
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # ---------------------------------------------------------------------------
  # Redis 缓存
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      password: graphnexus123
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---------------------------------------------------------------------------
  # RabbitMQ 消息队列
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: graphnexus
    password: graphnexus123
    virtual-host: graphnexus

  # ---------------------------------------------------------------------------
  # DeepSeek API（Spring AI OpenAI starter，兼容 OpenAI 协议）
  # API Key 通过 .env 文件注入：source .env && mvn spring-boot:run
  # ---------------------------------------------------------------------------
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3
          max-tokens: 4096

    # ---------------------------------------------------------------------------
    # Ollama 本地（兜底）— 当 DeepSeek API 不可用时使用
    # 前置：ollama pull deepseek-r1:7b && ollama serve
    # ---------------------------------------------------------------------------
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        options:
#          model: deepseek-r1:7b
#          temperature: 0.3
#          max-tokens: 4096

  # ---------------------------------------------------------------------------
  # MinIO 对象存储
  # ---------------------------------------------------------------------------
  # MinIO 无 Spring Boot 自动配置，使用 MinioClient 手动管理

# ---------------------------------------------------------------------------
# MinIO 自定义配置
# ---------------------------------------------------------------------------
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: graphnexus-dev

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  level:
    com.graphnexus: DEBUG
    com.graphnexus.infra: INFO