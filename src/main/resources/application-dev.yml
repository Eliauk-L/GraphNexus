# =============================================================================
# GraphNexus 开发环境配置
# =============================================================================
# 用途: 本地开发，连接 podman-compose 启动的容器
# 启动: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================================================

spring:
  
  # ---------------------------------------------------------------------------
  # Neo4j 图数据库
  # ---------------------------------------------------------------------------
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: graphnexus123
    pool:
      max-connection-pool-size: 20

  # ---------------------------------------------------------------------------
  # MySQL 关系数据库
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/graphnexus?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: graphnexus
    password: graphnexus123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ---------------------------------------------------------------------------
  # 文件上传限制
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # ---------------------------------------------------------------------------
  # Redis 缓存
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      password: graphnexus123
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---------------------------------------------------------------------------
  # RabbitMQ 消息队列
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: graphnexus
    password: graphnexus123
    virtual-host: graphnexus

  # ---------------------------------------------------------------------------
  # DeepSeek API（Spring AI OpenAI starter，兼容 OpenAI 协议）
  # API Key 通过 .env 文件注入：source .env && mvn spring-boot:run
  # ---------------------------------------------------------------------------
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3
          max-tokens: 4096

    # ---------------------------------------------------------------------------
    # Ollama 本地（兜底）— 当 DeepSeek API 不可用时使用
    # 前置：ollama pull deepseek-r1:7b && ollama serve
    # ---------------------------------------------------------------------------
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        options:
#          model: deepseek-r1:7b
#          temperature: 0.3
#          max-tokens: 4096

  # ---------------------------------------------------------------------------
  # MinIO 对象存储
  # ---------------------------------------------------------------------------
  # MinIO 无 Spring Boot 自动配置，使用 MinioClient 手动管理

# ---------------------------------------------------------------------------
# MinIO 自定义配置
# ---------------------------------------------------------------------------
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: graphnexus-dev

# ---------------------------------------------------------------------------
# 宽图谱融合配置
# ---------------------------------------------------------------------------
fusion:
  kp-matching:
    strategy: fuzzy             # fuzzy（模糊匹配）/ exact（精确匹配）/ vector-similarity（未来）
    threshold: 0.85             # 融合相似度阈值
  weight:
    strategy: time-decay        # time-decay（时间衰减）/ simple-average（简单平均）/ ewma（未来）
  rollback:
    weight-tolerance: 0.01      # MASTERS weight 回滚校验容差

# ---------------------------------------------------------------------------
# 策略专属配置 — 各策略独立绑定前缀，新增策略只需加新配置块
# ---------------------------------------------------------------------------
fusion.strategy.fuzzy:
  alpha: 0.3                    # 字符 Jaccard 权重
  beta: 0.5                     # Bigram Jaccard 权重
  gamma: 0.2                    # 归一化编辑距离权重

fusion.strategy.time-decay:
  factor: 0.9                   # 月衰减因子（0~1）

# ---------------------------------------------------------------------------
# 图指标度量配置（graph-metrics）
# ---------------------------------------------------------------------------
graph:
  metrics:
    cache:
      ttl-minutes: 5               # Caffeine 缓存 TTL（分钟）
      max-size: 50                  # 最大缓存条目数
    page-rank:
      max-iterations: 20            # PageRank 最大迭代次数
      damping-factor: 0.85          # PageRank 阻尼因子

# ---------------------------------------------------------------------------
# MinerU PDF 解析（开发环境）
# ---------------------------------------------------------------------------
mineru:
  enabled: true
  api:
    base-url: https://mineru.net
#    version: v1
#    submit-path: /api/v1/agent/parse/file
#    poll-path-template: /api/v1/agent/parse/{taskId}
    version: v4
    submit-path: /api/v4/file-urls/batch
    poll-path-template: /api/v4/extract-results/batch/{batch_id}
    token: ${MINERU_API_TOKEN:}
    model-version: vlm
    parser-name: mineru-v1
    poll-timeout: 300s
    poll-interval: 3s
  parse:
    enable-formula: true
    enable-table: true
    language: ch

# ---------------------------------------------------------------------------
# 智能问答配置
# ---------------------------------------------------------------------------
query:
  token-budget:
    max-input-tokens: 8000
    chars-per-token: 3
  pruning:
    weak-threshold: 0.6
    max-prerequisite-hops: 2
  retry:
    max-retries: 2
    retry-delay-ms: 1000
  async:
    core-pool-size: 2
    max-pool-size: 5
    queue-capacity: 10
  timeout:
    sync-timeout-seconds: 30

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  level:
    com.graphnexus: DEBUG
    com.graphnexus.infra: INFO
    com.graphnexus.infrastructure.mineru: DEBUG

# ---------------------------------------------------------------------------
# SpringDoc OpenAPI 3.0 配置
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false
  default-produces-media-type: application/json