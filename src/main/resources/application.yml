server:
  port: 8080

spring:
  application:
    name: graphnexus

  # Profile 覆盖：开发环境见 application-dev.yml
  profiles:
    active: dev

  # Logging
  output:
    ansi:
      enabled: always

  # =========================================================================
  # 排除自动配置 —— 无基础设施时仍可启动
  # 新增基础设施后需逐个取消对应 exclude（见 DESIGN.md D1）
  # =========================================================================
  autoconfigure:
    exclude:
      # Neo4j — 已激活（knowledge-graph-extraction）
      # Redis
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # RabbitMQ
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # Security（本次不配置安全规则，所有端点开放）
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      # 基础设施健康检查（已在 management.health 中逐一禁用，此处 double check）
      - org.springframework.boot.actuate.autoconfigure.redis.RedisHealthContributorAutoConfiguration

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    neo4j:
      enabled: true
    db:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.graphnexus: INFO
    org.springframework.web: INFO
    org.springframework.data.neo4j: WARN
    org.springframework.data.redis: WARN

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: false