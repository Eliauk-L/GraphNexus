# =============================================================================
# GraphNexus 集成测试配置
# =============================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

minio:
  endpoint: http://localhost:${minio.port:9000}
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: graphnexus-test

# ---------------------------------------------------------------------------
# MinerU — 测试环境默认关闭（单元测试直接 mock MinerUClient）
# ---------------------------------------------------------------------------
mineru:
  enabled: false
  api:
    base-url: http://localhost:19999
    token: test-token
    model-version: vlm
    poll-timeout: 5s
    poll-interval: 100ms
  parse:
    enable-formula: true
    enable-table: true
    language: ch