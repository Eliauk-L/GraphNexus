# =============================================================================
# GraphNexus 集成测试配置
# =============================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

minio:
  endpoint: http://localhost:${minio.port:9000}
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: graphnexus-test